<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="A laptop on a video call with two speech bubbles, one asking a question and one answering">
  <ellipse cx="160" cy="206" rx="130" ry="8" fill="#E4DCCF"/>
  <!-- Laptop -->
  <rect x="64" y="70" width="192" height="116" rx="8" fill="#FFFFFF" stroke="#1C2333" stroke-width="2.5"/>
  <rect x="76" y="82" width="168" height="92" rx="4" fill="#E8EDFA"/>
  <path d="M44 186h232l-14 14H58z" fill="#F3E6D3" stroke="#1C2333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Interviewer on screen -->
  <circle cx="160" cy="116" r="16" fill="#C8955A" stroke="#1C2333" stroke-width="2.5"/>
  <path d="M128 174c4-20 18-30 32-30s28 10 32 30" fill="#2445A8" stroke="#1C2333" stroke-width="2.5"/>
