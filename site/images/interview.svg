  <path d="M192 10h108a8 8 0 0 1 8 8v28a8 8 0 0 1-8 8h-18v12l-14-12h-76a8 8 0 0 1-8-8V18a8 8 0 0 1 8-8z" fill="#FFE27A" stroke="#1C2333" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M204 26h84M204 38h60" stroke="#1C2333" stroke-width="4" stroke-linecap="round"/>
